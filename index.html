<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080b1b" />
  <title>Hello, World!</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: white;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 18% 22%, #5b21b6 0, transparent 35%),
        radial-gradient(ellipse at 82% 78%, #075985 0, transparent 38%),
        linear-gradient(135deg, #080b1b, #11152c 55%, #090d1c);
    }

    .glow {
      position: fixed;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .35;
      pointer-events: none;
      animation: drift 12s ease-in-out infinite alternate;
    }

    .glow.one { background: #a855f7; top: -140px; left: -100px; }
    .glow.two { background: #22d3ee; right: -120px; bottom: -150px; animation-delay: -5s; }

    .site-nav {
      position: fixed;
      z-index: 2;
      top: 1.5rem;
      right: clamp(1rem, 5vw, 4rem);
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .45rem;
      border: 1px solid rgb(255 255 255 / 14%);
      border-radius: 999px;
      background: rgb(15 18 40 / 65%);
      backdrop-filter: blur(14px);
    }

    .site-nav a {
      padding: .65rem 1rem;
      border-radius: 999px;
      color: #dbeafe;
      font-size: .9rem;
      text-decoration: none;
      transition: background .2s ease, color .2s ease;
    }

    .site-nav a:hover, .site-nav a[aria-current="page"] {
      color: white;
      background: rgb(255 255 255 / 12%);
    }

    main {
      position: relative;
      width: min(90vw, 820px);
      padding: clamp(3rem, 9vw, 6.5rem) 2rem;
      text-align: center;
      border: 1px solid rgb(255 255 255 / 16%);
      border-radius: 32px;
      background: rgb(255 255 255 / 7%);
      box-shadow: 0 30px 100px rgb(0 0 0 / 35%);
      backdrop-filter: blur(18px);
      animation: appear 1s cubic-bezier(.2,.8,.2,1) both;
    }

    .eyebrow {
      margin: 0 0 1.3rem;
      color: #a5f3fc;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.2rem, 11vw, 7.5rem);
      line-height: .95;
      letter-spacing: -.075em;
      background: linear-gradient(100deg, #fff 10%, #c4b5fd 48%, #67e8f9 90%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 70px rgb(103 232 249 / 18%);
    }

    .sparkle {
      display: inline-block;
      color: #fef08a;
      font-size: .48em;
      vertical-align: top;
      animation: twinkle 2s ease-in-out infinite;
    }

    .tagline {
      margin: 1.8rem 0 0;
      color: #cbd5e1;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      letter-spacing: .02em;
    }

    .button {
      display: inline-block;
      margin-top: 2.2rem;
      padding: .9rem 1.35rem;
      border: 1px solid rgb(255 255 255 / 25%);
      border-radius: 999px;
      color: white;
      font-size: .9rem;
      font-weight: 650;
      text-decoration: none;
      background: linear-gradient(110deg, rgb(139 92 246 / 35%), rgb(34 211 238 / 25%));
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 35px rgb(34 211 238 / 22%);
    }

    .button:focus-visible {
      outline: 2px solid #a5f3fc;
      outline-offset: 4px;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(24px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes twinkle {
      50% { transform: rotate(18deg) scale(1.25); opacity: .65; }
    }

    @keyframes drift {
      to { transform: translate(50px, 35px) scale(1.12); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="index.html" aria-current="page">Home</a>
    <a href="about.html">About</a>
    <a href="login.html">Login</a>
  </nav>
  <div class="glow one" aria-hidden="true"></div>
  <div class="glow two" aria-hidden="true"></div>

  <main>
    <p class="eyebrow">A little something to begin</p>
    <h1>Hello,<br />World<span class="sparkle" aria-hidden="true">✦</span></h1>
    <p class="tagline">Big ideas can start with two simple words.</p>
    <a class="button" href="#hello" onclick="this.textContent='✨ Hello to you too!'">
      Say hello
    </a>
  </main>
</body>
</html>
