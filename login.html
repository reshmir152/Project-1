<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080b1b" />
  <title>Login | Hello, World!</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 7rem 1.25rem 3rem; display: grid; place-items: center; color: white; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: radial-gradient(ellipse at 18% 22%, #5b21b6 0, transparent 35%), radial-gradient(ellipse at 82% 78%, #075985 0, transparent 38%), linear-gradient(135deg, #080b1b, #11152c 55%, #090d1c); }
    .site-nav { position: fixed; z-index: 2; top: 1.5rem; right: clamp(1rem, 5vw, 4rem); display: flex; gap: .5rem; padding: .45rem; border: 1px solid rgb(255 255 255 / 14%); border-radius: 999px; background: rgb(15 18 40 / 65%); backdrop-filter: blur(14px); }
    .site-nav a { padding: .65rem 1rem; border-radius: 999px; color: #dbeafe; font-size: .9rem; text-decoration: none; transition: background .2s ease, color .2s ease; }
    .site-nav a:hover, .site-nav a[aria-current="page"] { color: white; background: rgb(255 255 255 / 12%); }
    main { width: min(100%, 480px); padding: clamp(2rem, 7vw, 3.5rem); border: 1px solid rgb(255 255 255 / 16%); border-radius: 28px; background: rgb(255 255 255 / 7%); box-shadow: 0 30px 100px rgb(0 0 0 / 35%); backdrop-filter: blur(18px); animation: appear .8s ease both; }
    .eyebrow { margin: 0 0 .8rem; color: #a5f3fc; font-size: .75rem; font-weight: 700; letter-spacing: .28em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.5rem, 8vw, 4rem); letter-spacing: -.07em; background: linear-gradient(100deg, #fff 10%, #c4b5fd 48%, #67e8f9 90%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .intro { margin: .8rem 0 2rem; color: #cbd5e1; line-height: 1.6; }
    label { display: block; margin: 1.1rem 0 .5rem; color: #e2e8f0; font-size: .9rem; font-weight: 600; }
    input { width: 100%; padding: .9rem 1rem; border: 1px solid rgb(255 255 255 / 18%); border-radius: 12px; outline: none; color: white; font: inherit; background: rgb(8 11 27 / 45%); }
    input::placeholder { color: #94a3b8; }
    input:focus { border-color: #67e8f9; box-shadow: 0 0 0 3px rgb(103 232 249 / 14%); }
    button { width: 100%; margin-top: 1.6rem; padding: .95rem 1.2rem; border: 1px solid rgb(255 255 255 / 24%); border-radius: 999px; color: white; font: inherit; font-weight: 700; cursor: pointer; background: linear-gradient(110deg, rgb(139 92 246 / 65%), rgb(34 211 238 / 45%)); transition: transform .2s ease, box-shadow .2s ease; }
    button:hover { transform: translateY(-2px); box-shadow: 0 10px 35px rgb(34 211 238 / 22%); }
    .notice { min-height: 1.5rem; margin: 1rem 0 0; color: #a5f3fc; font-size: .9rem; line-height: 1.5; }
    .back { display: block; margin-top: 1rem; color: #cbd5e1; text-align: center; text-decoration: none; font-size: .9rem; }
    .back:hover { color: white; text-decoration: underline; }
    @keyframes appear { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="login.html" aria-current="page">Login</a>
  </nav>
  <main>
    <p class="eyebrow">Welcome back</p>
    <h1>Log in.</h1>
    <p class="intro">Enter your details to continue.</p>
    <form id="login-form">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Your password" autocomplete="current-password" required />
      <button type="submit">Log in</button>
      <p class="notice" id="notice" role="status" aria-live="polite"></p>
    </form>
    <a class="back" href="index.html">← Back to the home page</a>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', function (event) {
      event.preventDefault();
      document.getElementById('notice').textContent = 'This is a demo login form. Connect an authentication service to sign in.';
    });
  </script>
</body>
</html>
